name: CLA

# Contributor License Agreement check for external contributors (ADR-0002).
# Disabled until the maintainer approves docs/legal/CLA.md and sets the
# repository variable CLA_ENABLED=true (see the PR that added this file).
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write # commits signatures to the unprotected cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA
    if: >-
      vars.CLA_ENABLED == 'true' && (
        github.event_name == 'pull_request_target' ||
        github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Maintained drop-in for the archived contributor-assistant/github-action.
      # It never checks out PR code, so pull_request_target is safe here.
      - uses: step-security/contributor-assistant-github-action@b9bd60bf1b766fa48dae03427059187137236239 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/v1/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/develop/docs/legal/CLA.md
          branch: cla-signatures
          allowlist: Yabish,renovate[bot],dependabot[bot],github-actions[bot],*[bot]
          lock-pullrequest-aftermerge: false
