packages:
  - apps/*
  - packages/*
  - tools/*

# Shared versions: packages reference these with "catalog:" so one bump
# updates the whole monorepo.
catalog:
  "@eslint/js": 10.0.1
  "@types/node": 24.19.0
  "@vitest/coverage-v8": 5.0.3
  eslint: 10.12.0
  globals: 17.13.0
  prettier: 3.9.9
  turbo: 2.11.5
  # Held at 6.0.x: typescript-eslint's peer range is <6.1.0 and the
  # presets rely on type-aware lint rules. Revisit when it supports 7.x.
  typescript: 6.0.3
  typescript-eslint: 8.71.0
  vitest: 5.0.3

minimumReleaseAgeExclude:
  - "@vitest/mocker@5.0.3"
  - "@vitest/spy@5.0.3"
  - vitest@5.0.3
